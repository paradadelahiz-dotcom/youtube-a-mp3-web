<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de YouTube a MP3</title>
    <style>
        /* --- ESTILOS GENERALES Y FUENTE --- */
        @import url('https://googleapis.com');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- BARRA DE NAVEGACIÓN SUPERIOR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f12c4c; /* Rojo vibrante exacto de la imagen */
            padding: 18px 45px;
            color: white;
            box-shadow: 0 4px 15px rgba(241, 44, 76, 0.1);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 0.5px;
            gap: 10px;
        }

        /* SVG del logo de YouTube estilizado en color blanco */
        .brand-logo svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: #ffffff;
        }

        /* Botón Actualizar */
        .btn-actualizar {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-actualizar:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn-actualizar svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content {
            flex: 1;
            text-align: center;
            padding: 90px 20px 40px 20px;
            /* Fondo con degradado sutil rosa en la esquina izquierda */
            background: radial-gradient(circle at 10% 20%, rgba(241, 44, 76, 0.06) 0%, transparent 45%);
            position: relative;
        }

        .user-badge {
            color: #f12c4c;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .main-title {
            color: #f12c4c;
            font-size: 52px;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.15;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 45px;
        }

        /* --- CONTENEDOR DE BÚSQUEDA --- */
        .search-wrapper {
            max-width: 680px;
            margin: 0 auto 50px auto;
            position: relative;
            background: white;
            border-radius: 50px;
            padding: 6px;
            box-shadow: 0 15px 35px rgba(241, 44, 76, 0.06), 0 5px 15px rgba(0, 0, 0, 0.02);
            border: 1px solid #ffe4e6;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 24px;
            color: #f12c4c;
            display: flex;
            align-items: center;
        }

        .search-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .search-input {
            width: 100%;
            padding: 14px 160px 14px 55px;
            border-radius: 50px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            color: #1f2937;
        }

        .search-input::placeholder {
            color: #9ca3af;
        }

        .btn-buscar {
            position: absolute;
            right: 6px;
            background-color: #1a68ff; /* Azul exacto del botón Buscar */
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-buscar:hover {
            background-color: #0052cc;
        }

        .btn-buscar:active {
            transform: scale(0.98);
        }

        /* --- SECCIÓN DE CARACTERÍSTICAS --- */
        .features-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .feature-item-blue {
            color: #1a68ff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feature-item-dark {
            color: #4b5563;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Icono de rombo azul (✦) */
        .diamond-icon {
            font-size: 10px;
        }

        /* --- BOTÓN FLOTANTE INFERIOR --- */
        .music-fab {
            background-color: #f12c4c;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 60px auto 20px auto;
            box-shadow: 0 10px 25px rgba(241, 44, 76, 0.35);
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .music-fab:hover {
            transform: translateY(-3px);
        }

        .music-fab svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <div class="brand-logo">
            <!-- Icono SVG oficial de YouTube incrustado en blanco -->
            <svg viewBox="0 0 24 24">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            MP3 YOUTUBE
        </div>
        <div class="nav-menu">
            <a href="#" class="nav-link">Explorar</a>
            <!-- Botón cambiado de "Descargas" a "Descargar" como solicitaste -->
            <a href="#" class="nav-link">Descargar</a>
            <button class="btn-actualizar">
                <svg viewBox="0 0 24 24">
                    <path d="M19 12a7 7 0 0 1-7 7c-3.86 0-7-3.14-7-7s3.14-7 7-7c1.93 0 3.68.78 4.95 2.05L14 12h8V4l-2.64 2.64B10.929 10.929 0 0 0 12 1 11 11 0 0 0 1 12a11 11 0 0 0 11 11c5.5 0 10.02-4.04 10.84-9.33H19z"/>
                </svg>
                Actualizar
            </button>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <!-- Badge de Usuario -->
        <span class="user-badge">• Sergioph_008</span>

        <!-- Títulos -->
        <h1 class="main-title">Convertidor de YouTube<br>a MP3</h1>
        <p class="subtitle">Convierte música de YouTube a MP3 y descárgala sin registrarte.</p>

        <!-- Formulario de Búsqueda -->
        <div class="search-wrapper">
            <div class="search-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </div>
            <input type="text" class="search-input" placeholder="Busca una canción o pega un enlace de YouTube">
            <button class="btn-buscar">
                Buscar <span>→</span>
            </button>
        </div>

        <!-- Características Inferiores -->
        <div class="features-list">
            <div class="feature-item-blue">
                <span class="diamond-icon">✦</span> Audio y vídeo en alta calidad
            </div>
            <div class="feature-item-blue">
                <span class="diamond-icon">✦</span> Funciona sin iniciar sesión
            </div>
            <div class="feature-item-dark">
                <span class="diamond-icon">✦</span> App diseñada por Sergio Parada de la Hiz
            </div>
        </div>

        <!-- Botón Flotante Inferior de Música -->
        <div class="music-fab">
            <svg viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
        </div>
    </main>

    <!-- Enlace a tu JavaScript existente para que las funciones sigan operando -->
